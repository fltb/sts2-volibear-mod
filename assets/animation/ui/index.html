<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色 UI 素材</title><style>@font-face{font-family:UI;src:url('fonts/volibear_ui_v5.woff')}*{box-sizing:border-box}body{background:#101c28;color:#e8e9df;font:16px UI,system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:32px 24px}p{line-height:1.8;color:#b6c5cd}a{color:#9fe0e9}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}section{background:#192b39;border:1px solid #365061;border-radius:8px;padding:17px}img{display:block;max-width:100%;height:205px;object-fit:contain;margin:auto}h2{font-size:15px;overflow-wrap:anywhere}small{color:#a7bec9}</style><main><a href="../START_HERE.html">返回资产总览</a><h1>头像、地图与能量素材</h1><p>人物沿用批准原图，仅作等比缩放、界面裁切和锁定状态处理。下方是实际导出文件。</p><div id="grid"></div><p><a href="../vfx/index.html">状态与机制图标另见特效库</a> · <a href="manifest.json">用途与来源清单</a></p></main><script src="manifest.js"></script><script>for(const a of window.VOLIBEAR_UI.assets){const box=document.createElement('section');const link=document.createElement('a');link.href=a.file;link.download='';const im=new Image();im.src=a.file;im.alt=a.role;link.append(im);const h=document.createElement('h2');h.textContent=a.id;const s=document.createElement('small');s.textContent=a.size.join(' × ')+' · PNG';box.append(link,h,s);document.querySelector('#grid').append(box);}</script></html>
