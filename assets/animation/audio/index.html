<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沃利贝尔 · 声音素材库</title>
<style>@font-face{font-family:UI;src:url('../ui/fonts/volibear_ui_v5.woff')}*{box-sizing:border-box}body{margin:0;background:#101a26;color:#e8e7de;font:16px UI,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:34px 24px}a{color:#9de3eb}h1{font-size:32px;margin:10px 0}p{line-height:1.7;color:#c1c8ce}.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.badge{font-size:13px;color:#9bdce7;letter-spacing:.12em}input,select,button{font:inherit;color:inherit;background:#1c2c3c;border:1px solid #425463;border-radius:6px;padding:10px}button{cursor:pointer}button:hover{border-color:#9bdce7}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:#172432;border:1px solid #2b3f50;padding:18px;border-radius:10px}.card h2{font-size:17px;margin:0 0 8px}.meta{font-size:13px;color:#9dadbb;margin:9px 0}.card audio{width:100%;height:36px;margin:9px 0}.card a{margin-right:16px;font-size:13px}.muted{font-size:13px;color:#a7b1be}footer{margin-top:30px;border-top:1px solid #334555;padding-top:20px}output{color:#9bdce7}.wide{width:min(100%,600px)}#status{min-height:24px}</style>
<main><div class="top"><div><div class="badge">VOLIBEAR / AUDIO / V5</div><h1>战斗声音素材库</h1></div><a href="../START_HERE.html">返回资产总览</a></div>
<p>13 段无台词战斗发声与 34 段动作、雷电、卡牌和领域音效，共 47 个声音文件、54 个逻辑 cue。声音来自已记录的 CC0 素材与本项目的声音设计；不含 Riot 官方角色台词。所有音量均可独立调节。</p>
<div class="bar"><input id="search" placeholder="搜索名称或声音 ID" aria-label="搜索声音"><select id="category" aria-label="声音分类"><option value="all">全部声音</option><option value="voice">角色发声</option><option value="sfx">动作与机制</option><option value="loop">循环环境</option></select><label>预览音量 <input type="range" id="volume" min="0" max="1" step=".05" value=".65"></label><button id="stop">停止全部</button><output id="count"></output></div>
<div id="status" class="muted" role="status">点击播放试听；循环音效需手动停止。</div><div id="grid" class="grid"></div>
<footer><h2>连播索引</h2><p class="muted">按素材清单顺序播放，每段之间保留短暂停顿。独立文件更适合对照具体动作。</p><audio class="wide" controls preload="none" src="previews/audio_overview.ogg"></audio><p><a href="README.md">声音说明</a><a href="manifest.json"> 素材与 cue 清单</a><a href="CREDITS.md"> 来源及许可</a></p></footer></main>
<script src="manifest.js"></script><script>
const data=window.VOLIBEAR_AUDIO;const grid=document.querySelector('#grid');
function stopAll(except){document.querySelectorAll('audio').forEach(a=>{if(a!==except){a.pause();a.currentTime=0;}})}
function render(){const q=document.querySelector('#search').value.toLowerCase(),cat=document.querySelector('#category').value;const rows=data.assets.filter(a=>(a.id+' '+a.label_zh).toLowerCase().includes(q)&&(cat==='all'||cat==='loop'&&a.loop||cat==='voice'&&a.id.startsWith('voice_')||cat==='sfx'&&!a.id.startsWith('voice_')&&!a.loop));grid.replaceChildren();for(const a of rows){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=a.label_zh;const m=document.createElement('div');m.className='meta';m.textContent=a.id+' · '+a.duration_seconds.toFixed(2)+' 秒'+(a.loop?' · 循环':'');const au=document.createElement('audio');au.controls=true;au.preload='none';au.src=a.file;au.loop=a.loop;au.dataset.asset=a.id;au.volume=Number(document.querySelector('#volume').value);au.addEventListener('play',()=>{stopAll(au);document.querySelector('#status').textContent='正在播放：'+a.label_zh});au.addEventListener('error',()=>document.querySelector('#status').textContent='此文件未加载成功，请完整解压工程包后重试：'+a.file);const links=document.createElement('div');for(const [label,path] of [['OGG',a.file],['WAV 母版',a.wav]]){const link=document.createElement('a');link.textContent=label;link.href=path;link.download='';links.append(link)}card.append(h,m,au,links);grid.append(card)}document.querySelector('#count').textContent=rows.length+' / '+data.assets.length;}
document.querySelector('#search').addEventListener('input',()=>{stopAll();render()});document.querySelector('#category').addEventListener('change',()=>{stopAll();render()});document.querySelector('#stop').onclick=()=>{stopAll();document.querySelector('#status').textContent='已停止全部声音'};document.querySelector('#volume').oninput=e=>document.querySelectorAll('audio').forEach(a=>a.volume=Number(e.target.value));document.querySelector('footer audio').addEventListener('play',function(){stopAll(this)});render();
</script></html>
