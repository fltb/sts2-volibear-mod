<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沃利贝尔 V9 · 动画审查</title><style>body{margin:0;background:#15202c;color:#e7edf5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px}section{display:flex;gap:24px;flex-wrap:wrap}canvas{width:min(100%,640px);height:auto;background:#1a2634;border:1px solid #405063}aside{flex:1;min-width:260px}button,select,input{font:inherit;margin:8px 4px 8px 0;padding:8px}a{color:#7ed5ff}#seek{width:95%}p{line-height:1.6}.note{color:#bbc8d8}img{max-width:100%}</style><main><h1>沃利贝尔 V9 · 髋根、肩根与完整部件审查</h1><p class="note">候选版。静态保持参考体型；关节有重叠补底，运动允许露出下层。死亡使用独立倒伏逐帧绘画。当前页面仅列出已导出的动作。</p><section><canvas id="stage" width="512" height="512"></canvas><aside><select id="clips"></select><br><button id="play">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><input id="seek" type="range" min="0" value="0"><p id="info"></p><p id="state">正在读取本地清单…</p><p><a id="gif">打开 GIF</a> · <a id="webp">透明 WebP</a></p><p><a href="review/parts_contact.png">查看完整部件</a> · <a href="review/skeleton_neutral.png">骨骼位置</a></p><p class="note">检查肩肘腕、髋膝踝连续性；胸侧和髋部露出应有完整纹理。近侧手臂位于辫子前方。技术验证、画面审查和游戏内验证分别记录。</p><p><a href="../../references/identity/volibear_approved.png">批准原图</a> · <a href="previews/neutral_assembly.png">静态拼合</a></p></aside></section><p><a href="previews/joint_demo.gif">攻击／格挡／跳跃并排 GIF</a> · <a href="review/reference_comparison.png">原图与静态拼合对照</a></p><h2>静态部件与覆盖关系</h2><p class="note">关闭手臂或辫子，检查下层补画。这里显示原始静态装配；动作请用上方播放器检查。</p><section><canvas id="partsStage" width="512" height="512"></canvas><aside><button id="showAll">全部显示</button><button id="showCore">只看身体补底</button><div id="partOptions"></div></aside></section></main><script src="viewer_data.js"></script><script>
const $=id=>document.getElementById(id),ctx=$('stage').getContext('2d');let list=[],clip,atlas,frame=0,playing=true,last=0,acc=0;
function draw(){ctx.clearRect(0,0,512,512);if(atlas&&atlas.complete&&atlas.naturalWidth)ctx.drawImage(atlas,(frame%8)*512,Math.floor(frame/8)*512,512,512,0,0,512,512);$('seek').value=frame;$('info').textContent=clip?`${clip.name} · ${frame+1}/${clip.frame_count} 帧 · ${clip.technique==='authored_death_cels'?'倒伏逐帧绘画':'完整部件骨骼动画'}`:'';}
function select(){clip=list[$('clips').value];frame=0;acc=0;atlas=new Image();atlas.onload=()=>{$('state').textContent='图集已加载';draw()};atlas.onerror=()=>{$('state').textContent='图集加载失败：'+clip.atlas.image};atlas.src=clip.atlas.image;$('seek').max=clip.frame_count-1;$('gif').href=clip.gif;$('webp').href=clip.webp;draw();}
function pause(){playing=false;$('play').textContent='播放';}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('prev').onclick=()=>{pause();frame=(frame-1+clip.frame_count)%clip.frame_count;draw()};$('next').onclick=()=>{pause();frame=(frame+1)%clip.frame_count;draw()};$('seek').oninput=()=>{pause();frame=Number($('seek').value);draw()};$('clips').onchange=select;
if(window.V9_DATA){list=[...V9_DATA.clips,...V9_DATA.variants];list.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name;$('clips').append(o)});if(list.length)select();else $('state').textContent='尚无已导出的动作';}else $('state').textContent='缺少 viewer_data.js；请先完成导出并生成预览清单。';
function tick(now){if(last&&clip&&playing){acc+=Math.min(now-last,250);while(acc>=1000/24){acc-=1000/24;frame=(frame+1)%clip.frame_count;}draw();}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script><script src="parts_data.js"></script><script>
if(window.V9_RIG){const pc=document.getElementById('partsStage').getContext('2d'),images={},enabled={};const entries=Object.entries(V9_RIG.parts).sort((a,b)=>a[1].z-b[1].z);function partsDraw(){pc.clearRect(0,0,512,512);for(const [n,p] of entries){const im=images[n];if(enabled[n]&&im&&im.complete&&im.naturalWidth)pc.drawImage(im,46.6666667+p.origin[0]*.306666667,74+p.origin[1]*.306666667,p.size[0]*.306666667,p.size[1]*.306666667)}}const labels={upper_arm_socket_near:'近侧肩根（胸背后方）',torso:'躯干／胸腰髋',head:'头部',back_spikes:'背部石刺',braid_near:'近侧辫子',braid_far:'远侧辫子',upper_arm_near:'近侧上臂',forearm_near:'近侧前臂',hand_near:'近侧手掌',upper_arm_far:'远侧上臂',forearm_far:'远侧前臂',hand_far:'远侧手掌',thigh_near:'近侧大腿',shin_near:'近侧小腿',foot_near:'近侧脚',thigh_far:'远侧大腿',shin_far:'远侧小腿',foot_far:'远侧脚'};for(const [n,p] of entries){enabled[n]=true;let im=new Image();im.onload=partsDraw;im.src=p.file;images[n]=im;const label=document.createElement('label');label.style.display='block';const box=document.createElement('input');box.type='checkbox';box.checked=true;box.dataset.part=n;box.onchange=()=>{enabled[n]=box.checked;partsDraw()};label.append(box,labels[n]||n);document.getElementById('partOptions').append(label)}function setParts(core){for(const box of document.querySelectorAll('#partOptions input')){box.checked=!core||box.dataset.part==='torso';enabled[box.dataset.part]=box.checked}partsDraw()}document.getElementById('showAll').onclick=()=>setParts(false);document.getElementById('showCore').onclick=()=>setParts(true);}
</script>
</html>
