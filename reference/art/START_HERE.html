<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沃利贝尔 · 必要参考</title><style>@font-face{font-family:ReferenceSans;src:url('fonts/reference_ui.woff') format('woff');font-display:swap}body{font:16px/1.65 ReferenceSans,system-ui,sans-serif;background:#eef0eb;color:#243b42;max-width:1320px;margin:auto;padding:32px}@media(max-width:500px){body{padding:18px}h1{font-size:28px;line-height:1.3}.grid{grid-template-columns:1fr}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}figure{margin:0;padding:12px;background:white;border-radius:12px}img,video{display:block;width:100%;aspect-ratio:25/19;object-fit:contain;background:#28313d}figcaption{padding:12px 3px}a{color:#16767f}p{font-size:14px}h2{margin-top:40px}</style><h1>沃利贝尔 · 必要参考资料</h1><p>角色原始身份图、三个已认可的项目正向例、30张精选卡图、5段动作研究素材。旧研究的全量439张卡图不再重复打包。</p><p><a href="research/STS2_SUPPORT_V5.md">V5 引擎与音频核查</a> · <a href="research/ASSET_SCOPE_TR.md">TR 范围清单</a> · <a href="audio_sources/README.md">声音来源</a></p><h2>身份与项目正向例</h2><div class="grid"><figure><a href="identity/volibear_approved.png"><img src="identity/volibear_approved.png" alt="原始角色参考"></a><figcaption>原始角色参考</figcaption></figure><figure><a href="project_examples/B01.png"><img src="project_examples/B01.png" alt="B01 打击"></a><figcaption>B01 打击</figcaption></figure><figure><a href="project_examples/U19.png"><img src="project_examples/U19.png" alt="U19 风暴不散"></a><figcaption>U19 风暴不散</figcaption></figure><figure><a href="project_examples/U37.png"><img src="project_examples/U37.png" alt="U37 风暴汇聚"></a><figcaption>U37 风暴汇聚</figcaption></figure></div><h2>精选卡面：看结构、接触点和大色块</h2><div class="grid"><figure><a href="style_examples/ironclad/aggression.webp"><img src="style_examples/ironclad/aggression.webp" alt="Aggression"></a><figcaption><strong>Aggression · ironclad</strong><p>学局部取景、实体重量和轮廓分层；不照搬护甲与绿色皮肤。</p><a href="https://spire-codex.com/static/images/cards/aggression.webp">来源</a></figcaption></figure><figure><a href="style_examples/ironclad/twin_strike.webp"><img src="style_examples/ironclad/twin_strike.webp" alt="Twin Strike"></a><figcaption><strong>Twin Strike · ironclad</strong><p>学双段节奏与高概括；不要让它变成两条通用细闪电。</p><a href="https://spire-codex.com/static/images/cards/twin_strike.webp">来源</a></figcaption></figure><figure><a href="style_examples/ironclad/molten_fist.webp"><img src="style_examples/ironclad/molten_fist.webp" alt="Molten Fist"></a><figcaption><strong>Molten Fist · ironclad</strong><p>学能量沿实体走向；不把火焰直接换蓝就当新构图。</p><a href="https://spire-codex.com/static/images/cards/molten_fist.webp">来源</a></figcaption></figure><figure><a href="style_examples/ironclad/inferno.webp"><img src="style_examples/ironclad/inferno.webp" alt="Inferno"></a><figcaption><strong>Inferno · ironclad</strong><p>学完整抽象体态；沃利贝尔要宽肩低重心，不能继承细长人形比例。</p><a href="https://spire-codex.com/static/images/cards/inferno.webp">来源</a></figcaption></figure><figure><a href="style_examples/ironclad/body_slam.webp"><img src="style_examples/ironclad/body_slam.webp" alt="Body Slam"></a><figcaption><strong>Body Slam · ironclad</strong><p>学身体参与和受力关系；不用原作盔甲角色或同一撞击轮廓。</p><a href="https://spire-codex.com/static/images/cards/body_slam.webp">来源</a></figcaption></figure><figure><a href="style_examples/ironclad/taunt.webp"><img src="style_examples/ironclad/taunt.webp" alt="Taunt"></a><figcaption><strong>Taunt · ironclad</strong><p>学挑衅手势与前后层次；熊用掌、肩与躯干表达。</p><a href="https://spire-codex.com/static/images/cards/taunt.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/claw.webp"><img src="style_examples/defect/claw.webp" alt="Claw"></a><figcaption><strong>Claw · defect</strong><p>学痕迹代替主体、三段形节奏；不要复制三条相同裂口。</p><a href="https://spire-codex.com/static/images/cards/claw.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/echo_form.webp"><img src="style_examples/defect/echo_form.webp" alt="Echo Form"></a><figcaption><strong>Echo Form · defect</strong><p>学能量化仍保留角色关系；不能复制机器人头、披风和圆核。</p><a href="https://spire-codex.com/static/images/cards/echo_form.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/darkness.webp"><img src="style_examples/defect/darkness.webp" alt="Darkness"></a><figcaption><strong>Darkness · defect</strong><p>学容器与聚能的主次；不要把熊爪画成机械手，也不让所有雷法都用捧球。</p><a href="https://spire-codex.com/static/images/cards/darkness.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/storm.webp"><img src="style_examples/defect/storm.webp" alt="Storm"></a><figcaption><strong>Storm · defect</strong><p>学雷的主干和空间汇聚；不要照搬漩涡加放射网。</p><a href="https://spire-codex.com/static/images/cards/storm.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/zap.webp"><img src="style_examples/defect/zap.webp" alt="Zap"></a><figcaption><strong>Zap · defect</strong><p>学单一雷击的粗细与负形；不要把每个雷伤数字画成一条电线。</p><a href="https://spire-codex.com/static/images/cards/zap.webp">来源</a></figcaption></figure><figure><a href="style_examples/defect/coolant.webp"><img src="style_examples/defect/coolant.webp" alt="Coolant"></a><figcaption><strong>Coolant · defect</strong><p>学局部主体配单向流动；不借机械核心外形。</p><a href="https://spire-codex.com/static/images/cards/coolant.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/glow.webp"><img src="style_examples/regent/glow.webp" alt="Glow"></a><figcaption><strong>Glow · regent</strong><p>学能力符号的尺度节奏；沃利贝尔改用自己的角纹和爪势。</p><a href="https://spire-codex.com/static/images/cards/glow.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/void_form.webp"><img src="style_examples/regent/void_form.webp" alt="Void Form"></a><figcaption><strong>Void Form · regent</strong><p>学同一身份进入更高抽象状态；熊形不能变成星冠法师。</p><a href="https://spire-codex.com/static/images/cards/void_form.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/reflect.webp"><img src="style_examples/regent/reflect.webp" alt="Reflect"></a><figcaption><strong>Reflect · regent</strong><p>学防守与回击的方向分工；不复用原角色与盾形。</p><a href="https://spire-codex.com/static/images/cards/reflect.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/cloak_of_stars.webp"><img src="style_examples/regent/cloak_of_stars.webp" alt="Cloak of Stars"></a><figcaption><strong>Cloak of Stars · regent</strong><p>学领域/防护与身体同构；不照搬披风、星纹和双火线。</p><a href="https://spire-codex.com/static/images/cards/cloak_of_stars.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/alignment.webp"><img src="style_examples/regent/alignment.webp" alt="Alignment"></a><figcaption><strong>Alignment · regent</strong><p>学少量重复形状如何形成秩序；不照搬摄政星形。</p><a href="https://spire-codex.com/static/images/cards/alignment.webp">来源</a></figcaption></figure><figure><a href="style_examples/regent/genesis.webp"><img src="style_examples/regent/genesis.webp" alt="Genesis"></a><figcaption><strong>Genesis · regent</strong><p>学连接/启用的单一触点；熊用爪和地面、体内雷脉。</p><a href="https://spire-codex.com/static/images/cards/genesis.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/murder.webp"><img src="style_examples/silent/murder.webp" alt="Murder"></a><figcaption><strong>Murder · silent</strong><p>剪影与有限结构高光，明暗大块先读清动作</p><a href="https://spire-codex.com/static/images/cards/murder.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/footwork.webp"><img src="style_examples/silent/footwork.webp" alt="Footwork"></a><figcaption><strong>Footwork · silent</strong><p>局部脚步、前后尺度和承重接触面</p><a href="https://spire-codex.com/static/images/cards/footwork.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/adrenaline.webp"><img src="style_examples/silent/adrenaline.webp" alt="Adrenaline"></a><figcaption><strong>Adrenaline · silent</strong><p>单一功能图形和粗细清楚的节奏折线</p><a href="https://spire-codex.com/static/images/cards/adrenaline.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/blur.webp"><img src="style_examples/silent/blur.webp" alt="Blur"></a><figcaption><strong>Blur · silent</strong><p>人物主轴、拖尾、来袭方向分工，主轮廓一眼读懂</p><a href="https://spire-codex.com/static/images/cards/blur.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/deflect.webp"><img src="style_examples/silent/deflect.webp" alt="Deflect"></a><figcaption><strong>Deflect · silent</strong><p>让接触点、受力方向、手臂负形承担格挡叙事</p><a href="https://spire-codex.com/static/images/cards/deflect.webp">来源</a></figcaption></figure><figure><a href="style_examples/silent/tracking.webp"><img src="style_examples/silent/tracking.webp" alt="Tracking"></a><figcaption><strong>Tracking · silent</strong><p>用身体局部触摸痕迹表达因果与追踪</p><a href="https://spire-codex.com/static/images/cards/tracking.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/bodyguard.webp"><img src="style_examples/necrobinder/bodyguard.webp" alt="Bodyguard"></a><figcaption><strong>Bodyguard · necrobinder</strong><p>夸大保护局部，主接触点最大最亮，次要主体退暗</p><a href="https://spire-codex.com/static/images/cards/bodyguard.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/calcify.webp"><img src="style_examples/necrobinder/calcify.webp" alt="Calcify"></a><figcaption><strong>Calcify · necrobinder</strong><p>实体端点与抽象身体连续，少数面提示体量</p><a href="https://spire-codex.com/static/images/cards/calcify.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/oblivion.webp"><img src="style_examples/necrobinder/oblivion.webp" alt="Oblivion"></a><figcaption><strong>Oblivion · necrobinder</strong><p>完整身体可用轮廓和少量体面概括，空间流向围绕主动作</p><a href="https://spire-codex.com/static/images/cards/oblivion.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/reanimate.webp"><img src="style_examples/necrobinder/reanimate.webp" alt="Reanimate"></a><figcaption><strong>Reanimate · necrobinder</strong><p>一个大动作局部配一个背景主形，轮廓极清楚</p><a href="https://spire-codex.com/static/images/cards/reanimate.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/dredge.webp"><img src="style_examples/necrobinder/dredge.webp" alt="Dredge"></a><figcaption><strong>Dredge · necrobinder</strong><p>局部与能量通过连续形状相连，有限色相靠明度分层</p><a href="https://spire-codex.com/static/images/cards/dredge.webp">来源</a></figcaption></figure><figure><a href="style_examples/necrobinder/demesne.webp"><img src="style_examples/necrobinder/demesne.webp" alt="Demesne"></a><figcaption><strong>Demesne · necrobinder</strong><p>领域用闭合边界、中心核心和大底形统一，物件多仍只一个主读法</p><a href="https://spire-codex.com/static/images/cards/demesne.webp">来源</a></figcaption></figure></div><h2>动作研究</h2><div class="grid"><figure><video controls preload="metadata" src="motion_examples/riot_volibear_Q.mp4"></video><figcaption>riot_volibear_Q · Riot Games<p><a href="https://www.leagueoflegends.com/en-us/champions/volibear/">原始发布页</a></p></figcaption></figure><figure><video controls preload="metadata" src="motion_examples/riot_volibear_W.mp4"></video><figcaption>riot_volibear_W · Riot Games<p><a href="https://www.leagueoflegends.com/en-us/champions/volibear/">原始发布页</a></p></figcaption></figure><figure><video controls preload="metadata" src="motion_examples/riot_volibear_E.mp4"></video><figcaption>riot_volibear_E · Riot Games<p><a href="https://www.leagueoflegends.com/en-us/champions/volibear/">原始发布页</a></p></figcaption></figure><figure><video controls preload="metadata" src="motion_examples/riot_volibear_R.mp4"></video><figcaption>riot_volibear_R · Riot Games<p><a href="https://www.leagueoflegends.com/en-us/champions/volibear/">原始发布页</a></p></figcaption></figure><figure><img src="motion_examples/megacrit_silent_2024_preview.gif" alt="megacrit_silent_2024_preview"><figcaption>megacrit_silent_2024_preview · Mega Crit<p><a href="https://www.megacrit.com/news/2024-10-02-neowsletter-issue-3/">原始发布页</a></p></figcaption></figure></div><p><a href="README.md">资料说明</a> · <a href="research/V5_SHOULDER_AND_OCCLUSION.md">本轮结构与动作标准</a></p></html>
